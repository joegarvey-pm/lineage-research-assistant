[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treetools"
# Read from treetools/__init__.py so `treetools --version` and the package
# metadata cannot drift apart.
dynamic = ["version"]
description = "A research harness for documented genealogy: GEDCOM in, a scored and reproducible confidence ledger out."
readme = "README.md"
# 3.9 is the floor. Nothing here needs anything newer, and keeping the floor
# low means this still runs on an old machine in ten years — which matters
# more than usual for a tool whose job is long-horizon record keeping.
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["genealogy", "gedcom", "family-history", "research", "provenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Sociology :: Genealogy",
]

# Deliberately one. This tool reads a GEDCOM off disk and talks to public
# archives over urllib; a dependency tree is a liability for something whose
# job is to still run in ten years.
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
treetools = "treetools.cli:main"

[tool.setuptools]
packages = ["treetools"]

[tool.setuptools.dynamic]
version = { attr = "treetools.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
